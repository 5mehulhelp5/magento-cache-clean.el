name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['30.1', '31.1', 'snapshot']
    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs-version }}

      - name: Byte-compile
        run: make compile

      - name: Lint
        run: make lint

      - name: Run tests
        run: make test
