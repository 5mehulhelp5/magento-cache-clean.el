name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['30.1', 'snapshot']
    steps:
      - uses: actions/checkout@v6

      - uses: purcell/setup-emacs@v7.0
        with:
          version: ${{ matrix.emacs-version }}

      - name: Byte-compile
        run: |
          emacs --batch -L . \
            --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile magento-cache-clean.el

      - name: Run tests
        run: |
          emacs --batch \
            -L . \
            -L test \
            -l ert \
            -l magento-cache-clean \
            -l magento-cache-clean-test \
            -f ert-run-tests-batch-and-exit
